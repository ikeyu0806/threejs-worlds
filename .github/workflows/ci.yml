name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start Cloudflare Pages production deploy
        env:
          DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
        run: |
          test -n "$DEPLOY_HOOK_URL"
          response="$(curl --fail-with-body --silent --show-error --request POST "$DEPLOY_HOOK_URL")"
          python3 -c 'import json,sys; d=json.loads(sys.argv[1]); r=d.get("result") or {}; assert d.get("success"), d.get("errors"); print(r.get("id", "started"))' "$response"
